{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>POS</h1><p>Record a sale and reduce stock automatically.</p></div><a class="btn light" href="/dashboard">Dashboard</a></div><section class="panel"><form method="post" action="/pos/sale" id="saleform"><div id="sale-items"><div class="sale-line"><select name="product_id" required>{% for p in products %}<option value="{{p['id']}}">{{p['name']}} — KSh {{'%.2f'|format(p['selling_price'])}} ({{p['stock_quantity']}})</option>{% endfor %}</select><input name="quantity" type="number" min="1" value="1" required></div></div><button type="button" class="btn light" onclick="addSaleLine()">＋ Add another item</button><label class="inline-label">Payment <select name="payment_method"><option value="cash">Cash</option><option value="mpesa">M-Pesa</option><option value="card">Card</option></select></label><button class="btn" type="submit">Complete Sale</button></form></section>{% endblock %}
