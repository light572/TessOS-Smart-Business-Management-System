{% extends "base.html" %}{% block content %}<header class="topbar"><div><h1>{{title}}</h1><p>{% if product %}Update product details and stock.{% else %}Add an item to inventory.{% endif %}</p></div><a class="secondary-btn" href="/products">← Back</a></header><div class="form-panel"><form method="POST" class="product-form"><section><h2>Product information</h2><label>Product name<input name="name" required value="{{product['name'] if product else ''}}" placeholder="e.g. Sugar 1kg"></label><label>Category<input name="category" value="{{product['category'] if product else ''}}" placeholder="e.g. Groceries"></label></section><section><h2>Pricing</h2><div class="form-row"><label>Buying price (KSh)<input type="number" step="0.01" min="0" name="buying_price" required value="{{product['buying_price'] if product else '0'}}"></label><label>Selling price (KSh)<input type="number" step="0.01" min="0" name="selling_price" required value="{{product['selling_price'] if product else '0'}}"></label></div></section><section><h2>Stock control</h2><div class="form-row"><label>Current stock<input type="number" min="0" name="stock_quantity" required value="{{product['stock_quantity'] if product else '0'}}"></label><label>Reorder level<input type="number" min="0" name="reorder_level" required value="{{product['reorder_level'] if product else '5'}}"></label></div></section><div class="form-actions"><a class="secondary-btn" href="/products">Cancel</a><button class="primary-btn">{{'Save Changes' if product else 'Add Product'}}</button></div></form></div>{% endblock %}
