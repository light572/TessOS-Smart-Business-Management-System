{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>{{title}}</h1><p>Enter product details.</p></div><a class="btn light" href="/products">← Back</a></div><section class="panel formpanel"><form method="post"><label>Product name<input name="name" required value="{{product['name'] if product else ''}}"></label><label>Category<input name="category" value="{{product['category'] if product else ''}}"></label><div class="two"><label>Buying price<input type="number" step=".01" min="0" name="buying_price" value="{{product['buying_price'] if product else 0}}"></label><label>Selling price<input type="number" step=".01" min="0" name="selling_price" value="{{product['selling_price'] if product else 0}}"></label></div><div class="two"><label>Current stock<input type="number" min="0" name="stock_quantity" value="{{product['stock_quantity'] if product else 0}}"></label><label>Reorder level<input type="number" min="0" name="reorder_level" value="{{product['reorder_level'] if product else 5}}"></label></div><button class="btn">{{'Save Changes' if product else 'Add Product'}}</button></form></section>{% endblock %}
