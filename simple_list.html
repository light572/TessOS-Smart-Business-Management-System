{% extends 'base.html' %}{% block content %}<div class="top"><div><h1>{{title}}</h1><p>{{subtitle}}</p></div></div><section class="panel"><form class="addmini" method="post" action="/{{kind}}/add"><input name="name" placeholder="{{title[:-1] if title.endswith('s') else title}} name" required><input name="phone" placeholder="Phone"><button class="btn">＋ Add</button></form><table><tr>{% for f,l in fields %}<th>{{l}}</th>{% endfor %}</tr>{% for r in rows %}<tr>{% for f,l in fields %}<td>{% if f=='balance' %}KSh {{'%.2f'|format(r[f])}}{% else %}{{r[f]}}{% endif %}</td>{% endfor %}</tr>{% else %}<tr><td colspan="3" class="empty">No records yet.</td></tr>{% endfor %}</table></section>{% endblock %}
