<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101c2c">
    <title>Customer Login | TessOS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        .customer-login {
            max-width: 440px;
            margin: 60px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,.08);
        }

        .customer-login h1 {
            color: #101c2c;
            margin-bottom: 8px;
        }

        .customer-login label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        .customer-login input {
            width: 100%;
            padding: 13px;
            border: 1px solid #dce2e8;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .customer-login button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #101c2c;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .customer-login a {
            color: #1769aa;
        }
    </style>
</head>

<body>

    <main class="customer-login">

        <h1>Welcome back</h1>

        <p>Sign in to your Tess Mama Enterprise customer account.</p>

        {% if error %}
        <div class="flash error" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label for="email">Email address</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                required
                autocomplete="email"
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
                autocomplete="current-password"
            >

            <button type="submit">Sign in</button>

        </form>

        <p style="text-align:center; margin-top:22px;">
            New customer?
            <a href="/customer/register">Create an account</a>
        </p>

        <p style="text-align:center;">
            <a href="/login">Staff login</a>
        </p>

    </main>

</body>
</html>
